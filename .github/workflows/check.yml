name: Check

on:
    push:
        branches:
            - "main"
            - "dev"
    pull_request:
        branches:
            - "main"

# A new push cancels the previous run of the same branch
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        strategy:
            matrix:
                node-version: [20, 22, 24] # keep in sync with "engines" in package.json

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm check

            - name: Run tests
              run: pnpm test
